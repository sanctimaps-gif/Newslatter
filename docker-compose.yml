# SanctiMaps Newsletter Studio — déploiement sur un serveur maîtrisé (VPS).
# Ne lancez ce fichier qu'après validation (voir documentation/deployment.md).
# Secrets : fichier .env sur le serveur (jamais commité).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: newsletter
      POSTGRES_USER: newsletter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U newsletter"], interval: 10s, retries: 5 }

  api:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://newsletter:${POSTGRES_PASSWORD}@db:5432/newsletter
      PUBLIC_URL: https://newsletter.sanctimaps.fr
      NODE_ENV: production
    volumes: [media:/app/storage/media]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://newsletter:${POSTGRES_PASSWORD}@db:5432/newsletter
      PUBLIC_URL: https://newsletter.sanctimaps.fr
      NODE_ENV: production
    command: ["npx", "tsx", "worker/src/index.ts"]
    volumes: [media:/app/storage/media]
    depends_on: { api: { condition: service_started } }

  # Reverse proxy + HTTPS automatique (Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]

  # Sauvegarde quotidienne de la base (rotation 14 jours)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [./backups:/backups, ./scripts/backup.sh:/backup.sh:ro]
    entrypoint: ["sh", "-c", "while true; do PGHOST=db sh /backup.sh /backups; sleep 86400; done"]
    depends_on: { db: { condition: service_healthy } }

volumes: { db-data: {}, media: {}, caddy-data: {}, caddy-config: {} }
