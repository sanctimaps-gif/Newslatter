# Alternative à Caddy si le serveur utilise déjà Nginx + Certbot.
# Certificat : sudo certbot --nginx -d newsletter.sanctimaps.fr
server {
    listen 80;
    server_name newsletter.sanctimaps.fr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name newsletter.sanctimaps.fr;
    ssl_certificate     /etc/letsencrypt/live/newsletter.sanctimaps.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsletter.sanctimaps.fr/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
